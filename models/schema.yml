version: 2

models:
  - name: dim_customers
    description: One record per customer
    columns:
      - name: customer_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: first_order_date
        description: NULL when a customer has not yet placed an order.

  - name: fct_orders
    description: The orders completed by the customer. 
    columns: 
      - name: order_id
        description: The order id correlated to the orders table. 
      - name: customer_id
        description: The customer id that completed the order. 
      - name: amount
        description: The amount of the order. 

  - name: stg_jaffle_shop__customers
    description: This model cleans up customer data
    columns:
      - name: customer_id
        description: Primary key
        tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders
    description: This model cleans up order data. One order per row.
    columns:
      - name: order_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: status
        description: "{{ doc("order_status") }}"
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

  - name: stg_stripe__orders
    description: This model lists the orders in the system for stripe.
    columns:
      - name: order_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: paymentmethod
        tests:
          - accepted_values:
              values: ['bank_transfer', 'coupon', 'credit_card', 'gift_card']
      - name: status
        description: The status for each of these orders.
        tests:
          - not_null
          - accepted_values:
              values: ['success', 'fail']
      - name: amount
        description: Amount of the transaction.
                